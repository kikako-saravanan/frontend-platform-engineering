name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        id: install
        run: |
          set +e
          npm cache clean --force
          for i in 1 2 3; do
            npm install --no-audit --no-fund
            status=$?
            if [ $status -eq 0 ] && [ -x node_modules/.bin/docusaurus ]; then
              exit 0
            fi
            echo "npm install failed (attempt $i, exit $status), retrying..."
            rm -rf node_modules
            sleep 10
          done
          exit 1
      - name: Show npm debug log
        if: failure() && steps.install.outcome == 'failure'
        run: cat /home/runner/.npm/_logs/*-debug-0.log
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
