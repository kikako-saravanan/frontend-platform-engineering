<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1a1a2e" />
  
  <!-- Platform layers -->
  <rect x="30" y="60" width="140" height="20" rx="4" fill="url(#gradient1)" />
  <rect x="40" y="90" width="120" height="20" rx="4" fill="url(#gradient2)" opacity="0.8" />
  <rect x="50" y="120" width="100" height="20" rx="4" fill="url(#gradient3)" opacity="0.6" />
  
  <!-- Code brackets -->
  <path d="M60 45 L50 55 L50 145 L60 155" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M140 45 L150 55 L150 145 L140 155" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" />
  
  <!-- Code lines -->
  <line x1="70" y1="70" x2="110" y2="70" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  <line x1="70" y1="100" x2="100" y2="100" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  <line x1="70" y1="130" x2="90" y2="130" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.5" />
  
  <!-- Gear/cog icon representing engineering -->
  <g transform="translate(100, 160)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#fff" stroke-width="3" />
    <circle cx="0" cy="0" r="5" fill="#fff" />
    <line x1="0" y1="-16" x2="0" y2="-12" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="12" x2="0" y2="16" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    <line x1="-16" y1="0" x2="-12" y2="0" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    <line x1="12" y1="0" x2="16" y2="0" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    <line x1="-11" y1="-11" x2="-8" y2="-8" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    <line x1="8" y1="8" x2="11" y2="11" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    <line x1="11" y1="-11" x2="8" y2="-8" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    <line x1="-8" y1="8" x2="-11" y2="11" stroke="#fff" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>